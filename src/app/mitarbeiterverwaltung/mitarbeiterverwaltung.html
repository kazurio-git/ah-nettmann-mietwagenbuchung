<div class="page-wrapper">

  <!-- Tab-Header -->
  <div class="tab-header">
    <span class="tab-label">Mitarbeitertabelle</span>
  </div>

  <div class="table-container">

    <!-- Tabelle -->
    <table class="mitarbeiter-table">
      <thead>
      <tr>
        <th class="col-id colcolor">ID</th>
        <th class="col-name colcolor">Nachname</th>
        <th class="col-pw colcolor colcolor-last">Passwort</th>
        <th class="col-row-actions">
          <div class="action-buttons">
            <button (click)="dialogOeffnenNeu()" class="btn-add" title="Neuer Mitarbeiter">
              <svg fill="white" height="22" viewBox="0 0 24 24" width="22" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
            </button>
          </div>

        </th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let ma of mitarbeiterListe" class="table-row">
        <td class="col-id colcolor colcolor-first">{{ ma.id }}</td>
        <td class="col-name colcolor">{{ ma.nachname }}</td>
        <td class="col-pw colcolor colcolor-last">
          <div class="pw-cell">
            <span class="pw-text">{{ ma.passwortSichtbar ? ma.passwort : '•••••' }}</span>
            <button (click)="ma.passwortSichtbar = !ma.passwortSichtbar" class="btn-eye" title="Passwort anzeigen">
              <svg fill="currentColor" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
                <path *ngIf="!ma.passwortSichtbar"
                      d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
                <path *ngIf="ma.passwortSichtbar"
                      d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.804 11.804 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65a3 3 0 0 0 3 3c.22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53a5 5 0 0 1-5-5c0-.79.2-1.53.53-2.2zm4.31-.78 3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
              </svg>
            </button>
          </div>
        </td>
        <td class="col-row-actions">
          <div class="row-hover-buttons">
            <button (click)="dialogOeffnenBearbeiten(ma)" class="btn-row-edit" title="Bearbeiten">
              <svg fill="white" height="15" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
              </svg>
            </button>
            <button (click)="mitarbeiterLoeschen(ma)" class="btn-row-delete" title="Löschen">
              <svg fill="white" height="15" viewBox="0 0 24 24" width="15" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 19c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
              </svg>
            </button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Dialog-Overlay -->
<div (click)="dialogSchliessen()" *ngIf="dialogSichtbar" class="dialog-overlay"></div>

<div *ngIf="dialogSichtbar" class="dialog">
  <div class="dialog-header">
    <h2>{{ dialogModus === 'neu' ? 'Neuen Mitarbeiter anlegen' : 'Mitarbeiter bearbeiten' }}</h2>
    <button (click)="dialogSchliessen()" class="btn-close" title="Schließen">✕</button>
  </div>

  <form #mitarbeiterForm="ngForm" (ngSubmit)="onSubmit()" class="dialog-form">

    <div class="form-group">
      <label for="ma-id">Mitarbeiter-ID</label>
      <input [(ngModel)]="formDaten.id" [disabled]="dialogModus === 'bearbeiten'" id="ma-id" name="id"
             placeholder="z. B. 010"
             required type="text"/>
    </div>

    <div class="form-group">
      <label for="ma-name">Nachname</label>
      <input [(ngModel)]="formDaten.nachname" id="ma-name" name="nachname" placeholder="Nachname eingeben" required
             type="text"/>
    </div>

    <div class="form-group">
      <label for="ma-pw">Passwort</label>
      <input [(ngModel)]="formDaten.passwort" id="ma-pw" name="passwort" placeholder="Passwort eingeben" required
             type="text"/>
    </div>

    <div class="dialog-actions">
      <button (click)="dialogSchliessen()" class="btn-cancel" type="button">Abbrechen</button>
      <button [disabled]="!mitarbeiterForm.valid" class="btn-submit" type="submit">
        {{ dialogModus === 'neu' ? 'Anlegen' : 'Speichern' }}
      </button>
    </div>

  </form>
</div>
