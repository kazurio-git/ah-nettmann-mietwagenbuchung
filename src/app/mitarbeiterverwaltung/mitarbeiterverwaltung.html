<div class="mx-auto max-w-200 bg-[#b6d4e8] rounded-[20px] p-8 pb-10 shadow-lg">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-xl font-bold">Mitarbeitertabelle</h2>
    <button
      (click)="openAddDialog()"
      class="w-10 h-10 rounded-md bg-green-500 hover:bg-green-600 text-white text-2xl font-bold flex items-center justify-center cursor-pointer shadow"
      title="Mitarbeiter hinzufügen"
      type="button"
    >
      +
    </button>
  </div>

  <table class="w-full border-collapse bg-white rounded-lg shadow">
    <thead>
    <tr class="bg-[#5ba3d9] text-white text-left">
      <th class="py-3 px-4 font-bold text-lg w-24">ID</th>
      <th class="py-3 px-4 font-bold text-lg">Nachname</th>
      <th class="py-3 px-4 font-bold text-lg">Passwort</th>
    </tr>
    </thead>

    <tbody>
      @for (ma of mitarbeiterListe; track ma.id; let i = $index) {
        <tr class="group relative border-b border-gray-200 even:bg-[#d6ebf7] hover:bg-[#c2dff0] transition-colors">

          @if (editIndex === i) {
            <!-- Bearbeitungsmodus -->
            <td class="py-3 px-4 font-mono text-sm">{{ ma.id }}</td>
            <td class="py-3 px-4">
              <input
                [(ngModel)]="editModel.nachname"
                class="w-full border border-gray-400 rounded px-2 py-1 text-sm bg-white outline-none focus:border-blue-500"
                placeholder="Nachname"
                type="text"
              />
            </td>
            <td class="py-3 px-4 relative">
              <input
                [(ngModel)]="editModel.passwort"
                class="w-full border border-gray-400 rounded px-2 py-1 text-sm bg-white outline-none focus:border-blue-500"
                placeholder="Passwort"
                type="text"
              />
              <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-full flex gap-1 pl-2">
                <button
                  (click)="saveEdit(i)"
                  class="w-8 h-8 rounded bg-green-500 hover:bg-green-600 text-white flex items-center justify-center cursor-pointer shadow"
                  title="Speichern"
                  type="button"
                >
                  ✓
                </button>
                <button
                  (click)="cancelEdit()"
                  class="w-8 h-8 rounded bg-gray-400 hover:bg-gray-500 text-white flex items-center justify-center cursor-pointer shadow"
                  title="Abbrechen"
                  type="button"
                >
                  ✕
                </button>
              </div>
            </td>
          } @else {
            <td class="py-3 px-4 font-mono text-sm">{{ ma.id }}</td>
            <td class="py-3 px-4">{{ ma.nachname }}</td>
            <td class="py-3 px-4 relative">
              <div class="flex items-center gap-2">
                <span class="font-mono text-sm">
                  @if (ma.passwortSichtbar) {
                    {{ ma.passwort }}
                  } @else {
                    *****
                  }
                </span>
                <button
                  (click)="togglePasswort(ma)"
                  class="w-7 h-7 rounded-full hover:bg-gray-200 flex justify-self-end items-center justify-center cursor-pointer text-gray-600 transition-colors opacity-0 group-hover:opacity-100"
                  title="Passwort anzeigen/verbergen"
                  type="button"
                >
                  @if (ma.passwortSichtbar) {
                    👁️
                  } @else {
                    👁️‍🗨️
                  }
                </button>
              </div>
              <div
                class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-full flex gap-1 pl-2 opacity-0 group-hover:opacity-100 transition-opacity">
                <button
                  (click)="startEdit(i)"
                  class="w-8 h-8 rounded bg-blue-500 hover:bg-blue-600 text-white flex items-center justify-center cursor-pointer shadow"
                  title="Bearbeiten"
                  type="button"
                >
                  ✎
                </button>
                <button
                  (click)="deleteMitarbeiter(i)"
                  class="w-8 h-8 rounded bg-red-500 hover:bg-red-600 text-white flex items-center justify-center cursor-pointer shadow"
                  title="Löschen"
                  type="button"
                >
                  🗑
                </button>
              </div>
            </td>
          }

        </tr>
      }
    </tbody>
  </table>

  @if (showAddDialog) {
    <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <h3 class="text-lg font-bold mb-6">Neuen Mitarbeiter anlegen</h3>

        <div class="mb-4">
          <label class="block font-bold mb-1 text-sm" for="new-nachname">Nachname</label>
          <input
            [(ngModel)]="newModel.nachname"
            class="w-full border border-gray-400 rounded px-3 py-2 text-sm bg-white outline-none focus:border-blue-500"
            id="new-nachname"
            placeholder="Nachname eingeben"
            type="text"
          />
        </div>

        <div class="mb-6">
          <label class="block font-bold mb-1 text-sm" for="new-passwort">Passwort</label>
          <input
            [(ngModel)]="newModel.passwort"
            class="w-full border border-gray-400 rounded px-3 py-2 text-sm bg-white outline-none focus:border-blue-500"
            id="new-passwort"
            placeholder="Passwort eingeben"
            type="text"
          />
        </div>

        <div class="flex gap-4">
          <button
            (click)="cancelAdd()"
            class="flex-1 py-2 font-bold rounded-full cursor-pointer shadow-md border-2 border-gray-500 bg-white text-gray-700 hover:bg-gray-100"
            type="button"
          >
            Abbrechen
          </button>
          <button
            (click)="addMitarbeiter()"
            class="flex-1 py-2 text-white font-bold rounded-full cursor-pointer shadow-md bg-blue-600 hover:bg-blue-700"
            type="button"
          >
            Anlegen
          </button>
        </div>
      </div>
    </div>
  }
</div>
