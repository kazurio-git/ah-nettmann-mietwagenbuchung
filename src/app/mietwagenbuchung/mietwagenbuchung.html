<div class="form-wrapper">
  <div class="form-card">
    <h2>Mietwagen buchen</h2>

    <form>
      <div class="field-group">
        <label for="kundennummer">Kundennummer</label>
        <input class="input-field short" id="kundennummer" placeholder="Kunden-Nr" type="text"/>
      </div>

      <div class="field-group">
        <label>Zeitraum</label>
        <div class="date-row">
          <input class="input-field date-input" placeholder="Start-Datum" type="date"/>
          <span class="dash">–</span>
          <input class="input-field date-input" placeholder="End-Datum" type="date"/>
        </div>
      </div>

      <div class="field-group">
        <label for="fahrzeugart">Fahrzeugart</label>
        <select class="input-field select-field" id="fahrzeugart">
          <option disabled selected value="">Fahrzeugart</option>
          <option value="pkw">PKW</option>
          <option value="transporter">Transporter</option>
          <option value="lkw">LKW</option>
        </select>
      </div>

      <div class="field-group">
        <label>Zusatzleistungen</label>
        <div class="checkbox-row">
          <label class="checkbox-label"><input type="checkbox"/> Navi</label>
          <label class="checkbox-label"><input type="checkbox"/> Klimaanlage</label>
          <label class="checkbox-label"><input type="checkbox"/> Standheizung</label>
        </div>
      </div>

      <div class="field-group">
        <label for="abholort">Abholort</label>
        <select class="input-field select-field" id="abholort">
          <option disabled selected value="">Abholort</option>
          <option value="berlin">Berlin</option>
          <option value="hamburg">Hamburg</option>
          <option value="muenchen">München</option>
        </select>
      </div>

      <button class="btn-buchen" type="submit">Buchen</button>
    </form>
  </div>
</div>
