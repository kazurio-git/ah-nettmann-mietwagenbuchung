<div class="form-wrapper">
  <div class="form-card">
    <h2>Mietwagen buchen</h2>

    <form>
      <div class="field-group">
        <label for="kundennummer">Kundennummer</label>
        <input class="input-field short" id="kundennummer" max="999999" min="1"
               placeholder="Kunden-Nr" required type="number"/>
        <span class="error-msg">Bitte eine gültige Kundennummer eingeben.</span>
      </div>

      <div class="field-group">
        <label>Zeitraum</label>
        <div class="date-row">
          <input class="input-field date-input" id="startdatum" required type="date"/>
          <span class="dash">–</span>
          <input class="input-field date-input" id="enddatum" required type="date"/>
        </div>
        <span class="error-msg">Bitte Start- und End-Datum auswählen.</span>
      </div>

      <div class="field-group">
        <label for="fahrzeugart">Fahrzeugart</label>
        <select class="input-field select-field" id="fahrzeugart" required>
          <option disabled selected value="">Fahrzeugart</option>
          <option value="pkw">PKW</option>
          <option value="transporter">Transporter</option>
          <option value="lkw">LKW</option>
        </select>
        <span class="error-msg">Bitte eine Fahrzeugart auswählen.</span>
      </div>

      <div class="field-group">
        <label>Zusatzleistungen</label>
        <div class="checkbox-row">
          <label class="checkbox-label"><input type="checkbox"/> Navi</label>
          <label class="checkbox-label"><input type="checkbox"/> Klimaanlage</label>
          <label class="checkbox-label"><input type="checkbox"/> Standheizung</label>
        </div>
      </div>

      <div class="field-group">
        <label for="abholort">Abholort</label>
        <select class="input-field select-field" id="abholort" required>
          <option selected value="AN">Autohaus Nettmann</option>
          <option value="TS">Tankstelle</option>
          <option value="SB">S-Bahnstation</option>
          <option value="HBF">Hauptbahnhof</option>
          TS bei Tankstelle
          SB bei S-Bahnstation
          AN bei Autohaus Nettmann (Standardwert!),
          HBF bei Hauptbahhof
        </select>
        <span class="error-msg">Bitte einen Abholort auswählen.</span>
      </div>

      <button class="btn-buchen" type="submit">Buchen</button>
    </form>
  </div>
</div>
